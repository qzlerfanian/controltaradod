[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rahband-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "paho-mqtt>=2,<3",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pyodbc>=5,<6",
  "PyYAML>=6,<7",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
hardware = ["nrcpy"]
anpr = ["opencv-python-headless>=4.9", "openvino>=2024", "ultralytics>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["rahband*"]
